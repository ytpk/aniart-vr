plugins {
    id 'com.android.application' version '8.1.4'
    id 'com.chaquo.python' version '16.1.0'
}
android {
    namespace 'dev.aniart.vr'
    compileSdk 34
    buildToolsVersion '34.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '23.2.8568313'
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'dev.aniart.vr'
        minSdk 31
        targetSdk 34
        versionCode 21
        versionName '0.6.8'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DBUILD_API_LAYERS=OFF', '-DBUILD_TESTS=ON', '-DBUILD_LOADER=ON',
                    '-DBUILD_CONFORMANCE_TESTS=OFF', '-DBUILD_ALL_EXTENSIONS=ON',
                    '-DHELLOXR_DEFAULT_GRAPHICS_PLUGIN=OpenGLES'
                targets 'openxr_loader', 'hello_xr'
            }
        }
    }
    sourceSets.main.manifest.srcFile 'AndroidManifest.xml'
    androidResources { noCompress += ['tflite', 'onnx'] }
    packaging {
        // FastRPC needs the DSP skeleton as an extracted file rather than an APK entry.
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libQnn*Skel.so', '**/libQnn*Stub.so']
        }
    }
    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython 'python3.12'
        pip {
            options '--no-deps'
            install '-r', 'anicli-requirements.txt'
            // The Android lxml wheel links to these. Desktop lxml bundles them itself.
            install 'chaquopy-libxml2==2.9.8'
            install 'chaquopy-libxslt==1.1.32'
        }
    }
}
dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android-qnn:1.24.3"
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
