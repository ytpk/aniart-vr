name: Convert Limbo V3 to LiteRT
on:
  push:
    branches: [main]
    paths:
      - 'tools/export_limbo_litert.*'
      - '.github/workflows/limbo-litert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install converter on CPU
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install litert-torch==0.9.4 onnxruntime==1.24.3 omegaconf addict einops opencv-python-headless e3nn
      - name: Export and compare with ONNX
        run: bash tools/export_limbo_litert.sh "$RUNNER_TEMP/limbo-v3-litert.tflite"
      - uses: actions/upload-artifact@v4
        with:
          name: Limbo-V3-LiteRT
          path: ${{ runner.temp }}/limbo-v3-litert.tflite
          if-no-files-found: error
