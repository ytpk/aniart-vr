name: Quest debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bundled ani-cli providers
        run: |
          python3.12 -m pip install --no-deps -r overlay/anicli-requirements.txt
          PYTHONPATH=overlay/src/main/python python3.12 tools/tests/check_anicli.py
      - name: Test Anixart playback routes
        run: ./tools/check_anixart.sh
      - name: Install Android tools
        run: |
          sdk="$RUNNER_TEMP/aniart-android-sdk"
          mkdir -p "$sdk"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk"
          manager="$sdk/cmdline-tools/bin/sdkmanager"
          (set +o pipefail; yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null)
          "$manager" --sdk_root="$sdk" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Build APK
        run: ./build.sh
      - name: Verify packaging
        shell: bash
        run: |
          apk=$(find .build/openxr/src/tests/hello_xr/build/outputs/apk/debug -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libhello_xr.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libopenxr_loader.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libpython3.12.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime4j_jni.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libtensorflowlite_gpu_jni.so'
          unzip -p "$apk" assets/chaquopy/requirements-common.imy > "$RUNNER_TEMP/aniart-requirements.zip"
          unzip -Z1 "$RUNNER_TEMP/aniart-requirements.zip" > "$RUNNER_TEMP/aniart-requirements.list"
          grep -qx 'lxml/etree.so' "$RUNNER_TEMP/aniart-requirements.list"
          grep -qx 'chaquopy/lib/libxml2.so' "$RUNNER_TEMP/aniart-requirements.list"
          grep -qx 'chaquopy/lib/libxslt.so' "$RUNNER_TEMP/aniart-requirements.list"
          grep -qx 'chaquopy/lib/libexslt.so' "$RUNNER_TEMP/aniart-requirements.list"
          grep -qx 'anicli_api/source/animego.pyc' "$RUNNER_TEMP/aniart-requirements.list"
      - uses: actions/upload-artifact@v4
        with:
          name: Aniart-VR-Quest-debug
          path: .build/openxr/src/tests/hello_xr/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          include-hidden-files: true
