name: Quest debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313' 'cmake;3.22.1'
      - name: Build APK
        run: ./build.sh
      - name: Verify packaging
        shell: bash
        run: |
          apk=$(find .build/openxr/src/tests/hello_xr/build/outputs/apk/debug -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libhello_xr.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libopenxr_loader.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Aniart-VR-Quest-debug
          path: .build/openxr/src/tests/hello_xr/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          include-hidden-files: true
